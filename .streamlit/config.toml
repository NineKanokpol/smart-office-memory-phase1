[theme]
base = "light"
font = "Noto Sans Thai, sans-serif"
headingFont = "Noto Sans Thai, sans-serif"
headingFontSizes = ["2rem", "1.375rem", "1.125rem", "1rem", "0.875rem", "0.8125rem"]
showSidebarBorder = false
showWidgetBorder = true
baseRadius = "0.875rem"
buttonRadius = "full"

[[theme.fontFaces]]
family = "Noto Sans Thai"
url = "app/static/NotoSansThai.ttf"
weight = "100 900"

[theme.light]
primaryColor = "#801F3F"
backgroundColor = "#FCF9FA"
secondaryBackgroundColor = "#F5E9EC"
textColor = "#21171B"
borderColor = "#8D7780"
linkColor = "#801F3F"

[theme.light.sidebar]
primaryColor = "#801F3F"
backgroundColor = "#F5E9EC"
secondaryBackgroundColor = "#FCF9FA"
textColor = "#21171B"
borderColor = "#8D7780"

[theme.dark]
primaryColor = "#9E3454"
backgroundColor = "#130D16"
secondaryBackgroundColor = "#29212A"
textColor = "#F7F1F3"
borderColor = "#867380"
linkColor = "#EBA0B9"

[theme.dark.sidebar]
primaryColor = "#9E3454"
backgroundColor = "#211B25"
secondaryBackgroundColor = "#30212C"
textColor = "#F7F1F3"
borderColor = "#867380"

[server]
maxUploadSize = 3
enableStaticServing = true

[client]
showErrorDetails = "none"

[browser]
gatherUsageStats = false
